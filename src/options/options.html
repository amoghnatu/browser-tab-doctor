<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Tab Doctor — Options</title>
    <link rel="stylesheet" href="../shared/styles.css" />
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1 data-i18n="appName">Browser Tab Doctor</h1>
        <p class="subtitle">Settings apply immediately — no extension reload required.</p>
      </header>

      <form id="options-form" novalidate>
        <fieldset>
          <legend>Threshold &amp; schedule</legend>

          <label>
            <span class="label-with-hint">
              <span data-i18n="optThreshold">Threshold (days)</span>
              <abbr
                class="info-hint"
                title="How many days without use before a tab is marked stale in the report and counts toward the toolbar badge. Default 7. Separate from “Long-idle days” under notifications."
                aria-label="How many days without use before a tab is marked stale in the report and counts toward the toolbar badge. Default 7."
              >ⓘ</abbr>
            </span>
            <input
              type="number"
              id="thresholdDays"
              name="thresholdDays"
              min="1"
              max="3650"
              step="1"
              required
            />
          </label>

          <label>
            <span class="label-with-hint">
              <span data-i18n="optReportHour">Daily report time (hour)</span>
              <abbr
                class="info-hint"
                title="Local hour (0–23) at or after which the once-per-day report snapshot may be saved. Default 9 (9:00 AM)."
                aria-label="Local hour 0–23 for the daily report snapshot. Default 9."
              >ⓘ</abbr>
            </span>
            <input
              type="number"
              id="reportHour"
              name="reportHour"
              min="0"
              max="23"
              step="1"
              required
            />
          </label>

          <label class="checkbox">
            <span class="label-with-hint">
              <span data-i18n="optBadge">Show toolbar badge</span>
              <abbr
                class="info-hint"
                title="When on, the extension icon shows a small count of stale tabs. Empty when nothing is stale."
                aria-label="When on, the extension icon shows a small count of stale tabs."
              >ⓘ</abbr>
            </span>
            <input type="checkbox" id="badgeEnabled" name="badgeEnabled" />
          </label>
        </fieldset>

        <fieldset>
          <legend>History &amp; privacy</legend>

          <label>
            <span class="label-with-hint">
              <span data-i18n="optRetention">History to keep (days)</span>
              <abbr
                class="info-hint"
                title="How many daily report snapshots to keep in local storage. Older ones are deleted automatically. Default 90."
                aria-label="How many daily report snapshots to keep. Default 90."
              >ⓘ</abbr>
            </span>
            <input
              type="number"
              id="retentionSnapshots"
              name="retentionSnapshots"
              min="1"
              max="3650"
              step="1"
              required
            />
          </label>

          <label class="checkbox">
            <span class="label-with-hint">
              <span data-i18n="optTruncateUrls">Truncate URLs in report</span>
              <abbr
                class="info-hint"
                title="When on, long URLs are shortened in the report table for readability (full URL still available on hover)."
                aria-label="When on, long URLs are shortened in the report table."
              >ⓘ</abbr>
            </span>
            <input type="checkbox" id="truncateUrls" name="truncateUrls" />
          </label>

          <label class="checkbox">
            <span class="label-with-hint">
              <span data-i18n="optStoreQuery">Store query strings</span>
              <abbr
                class="info-hint"
                title="When off, ?search=… and #hash are stripped before saving and matching tab URLs (more private, slightly less precise matching)."
                aria-label="When off, query strings are stripped before storing URLs."
              >ⓘ</abbr>
            </span>
            <input type="checkbox" id="storeQueryStrings" name="storeQueryStrings" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Proactive notifications</legend>
          <p class="hint">
            Rare system alerts when tab load is high and many tabs are long-idle.
            Does not replace the toolbar badge.
          </p>
          <label class="checkbox">
            <span class="label-with-hint">
              Enable proactive notifications
              <abbr
                class="info-hint"
                title="Master switch. When off, no system notifications are shown (badge and report still work)."
                aria-label="Master switch for system notifications."
              >ⓘ</abbr>
            </span>
            <input type="checkbox" id="notificationsEnabled" name="notificationsEnabled" />
          </label>
          <label>
            <span class="label-with-hint">
              Min open tabs
              <abbr
                class="info-hint"
                title="Only consider notifying if you have at least this many open tabs. Default 20."
                aria-label="Minimum open tabs required before a notification can fire. Default 20."
              >ⓘ</abbr>
            </span>
            <input type="number" id="notifyMinOpenTabs" name="notifyMinOpenTabs" min="1" max="10000" step="1" required />
          </label>
          <label>
            <span class="label-with-hint">
              Long-idle days
              <abbr
                class="info-hint"
                title="A tab counts as “long-idle” for notifications if unused for at least this many days (or last-used is unknown). Default 15. Independent of the report stale threshold."
                aria-label="Days unused before a tab counts as long-idle for notifications. Default 15."
              >ⓘ</abbr>
            </span>
            <input type="number" id="notifyLongIdleDays" name="notifyLongIdleDays" min="1" max="3650" step="1" required />
          </label>
          <label>
            <span class="label-with-hint">
              Share of tabs long-idle (%)
              <abbr
                class="info-hint"
                title="Only notify if at least this percentage of open tabs are long-idle. Default 35."
                aria-label="Percentage of open tabs that must be long-idle. Default 35."
              >ⓘ</abbr>
            </span>
            <input type="number" id="notifySharePercent" name="notifySharePercent" min="1" max="100" step="1" required />
          </label>
          <label>
            <span class="label-with-hint">
              Cooldown (days)
              <abbr
                class="info-hint"
                title="Minimum days to wait after a proactive notification before another one can appear — even if tab conditions are still met. Default 7."
                aria-label="Minimum days between proactive notifications. Default 7."
              >ⓘ</abbr>
            </span>
            <input type="number" id="notifyCooldownDays" name="notifyCooldownDays" min="1" max="3650" step="1" required />
          </label>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="primary" id="btn-save" data-i18n="save">Save</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
